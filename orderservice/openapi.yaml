openapi: 3.0.3

info:
  title: CampusEats Order Service
  description: REST API for managing CampusEats orders
  version: 1.0.0

servers:
  - url: http://localhost:5000

paths:

  /orders:
    post:
      summary: Create a new order
      operationId: createOrder

      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: Unique key used to safely retry the request

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'

      responses:
        '201':
          description: Order created successfully
          headers:
            Location:
              description: URL of the newly created order
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

        '400':
          description: Malformed request body or missing Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

        '503':
          description: Payment Service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'


    get:
      summary: Get orders filtered by status
      operationId: getOrders

      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending_payment
              - placed
              - confirmed
              - preparing
              - delivered
              - cancelled

      responses:
        '200':
          description: List of matching orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'

        '400':
          description: Invalid status filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'


  /orders/{orderId}:
    get:
      summary: Get a single order
      operationId: getOrder

      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'


  /orders/{orderId}/cancellation:
    post:
      summary: Cancel an order
      operationId: cancelOrder

      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'

      responses:
        '200':
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

        '400':
          description: Malformed cancellation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

        '409':
          description: Order cannot be cancelled in its current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

        '422':
          description: Cancellation rejected by the domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'


components:

  schemas:

    CreateOrderRequest:
      type: object
      required:
        - userId
        - restaurantId
        - items
      properties:
        userId:
          type: integer

        restaurantId:
          type: integer

        paymentMethod:
          type: string

        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'


    OrderItem:
      type: object
      required:
        - menuItemId
        - quantity
      properties:
        menuItemId:
          type: integer

        quantity:
          type: integer
          minimum: 1

        price:
          type: number
          minimum: 0


    CancelOrderRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: integer


    OrderResponse:
      type: object
      required:
        - orderId
        - userId
        - restaurantId
        - items
        - totalAmount
        - status
        - createdAt
      properties:
        orderId:
          type: integer

        userId:
          type: integer

        restaurantId:
          type: integer

        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

        totalAmount:
          type: number

        status:
          type: string
          enum:
            - pending_payment
            - placed
            - confirmed
            - preparing
            - delivered
            - cancelled

        createdAt:
          type: string
          format: date-time


    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string

        title:
          type: string

        status:
          type: integer

        detail:
          type: string